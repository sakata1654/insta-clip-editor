name: Build Windows installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check project layout
        shell: pwsh
        run: |
          foreach ($f in 'Cargo.toml','tauri.conf.json','build.rs') { if (Test-Path $f) { Write-Warning "Stray $f in the repo root (the real one belongs in src-tauri/) - ignoring it"; Remove-Item $f -Force } }
          $need = 'src-tauri/Cargo.toml','src-tauri/tauri.conf.json','src-tauri/build.rs','src-tauri/src/main.rs','src-tauri/env_check.py','src-tauri/whisper_run.py','src-tauri/capabilities/default.json','src/index.html','package.json','app-icon.png','scripts/fetch-binaries.ps1'
          $missing = $need | Where-Object { -not (Test-Path $_) }
          if ($missing) { throw "Missing files (upload the full folder structure from the zip): $($missing -join ', ')" }
          Write-Host 'Layout OK'
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: Bundle yt-dlp + ffmpeg
        shell: pwsh
        run: ./scripts/fetch-binaries.ps1
      - run: npm install
      - run: npx tauri icon app-icon.png
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: Insta-Clip-Studio-Setup
          path: src-tauri/target/release/bundle/nsis/*.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
