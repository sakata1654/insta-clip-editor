name: Build Windows installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix and check project layout
        shell: pwsh
        run: |
          # If files were uploaded flat (folders lost), put them back where they belong.
          function Place($name, $dest) {
            if (-not (Test-Path $name -PathType Leaf)) { return }
            $target = Join-Path $dest (Split-Path $name -Leaf)
            if (Test-Path $target) { Remove-Item $name -Force; Write-Host "Ignored stray $name (already in $dest)" }
            else { New-Item -ItemType Directory -Force $dest | Out-Null; Move-Item $name $target -Force; Write-Host "Moved $name -> $dest" }
          }
          foreach ($n in 'Cargo.toml','tauri.conf.json','build.rs','env_check.py','whisper_run.py','cohere_run.py') { Place $n 'src-tauri' }
          Place 'main.rs' 'src-tauri/src'
          Place 'default.json' 'src-tauri/capabilities'
          Place 'index.html' 'src'
          foreach ($n in 'fetch-binaries.ps1','setup.ps1') { Place $n 'scripts' }
          $need = 'src-tauri/Cargo.toml','src-tauri/tauri.conf.json','src-tauri/build.rs','src-tauri/src/main.rs','src-tauri/env_check.py','src-tauri/whisper_run.py','src-tauri/cohere_run.py','src-tauri/capabilities/default.json','src/index.html','package.json','app-icon.png','scripts/fetch-binaries.ps1'
          $missing = $need | Where-Object { -not (Test-Path $_) }
          if ($missing) { Get-ChildItem -Recurse -Depth 2 -Name | Select-Object -First 60; throw "Still missing: $($missing -join ', ') - upload these files to the repo" }
          Write-Host 'Layout OK'
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate frontend and helper scripts
        shell: pwsh
        run: |
          $html = Get-Content 'src/index.html' -Raw
          $match = [regex]::Match($html, '(?is)<script(?:\s[^>]*)?>(.*?)</script>')
          if (-not $match.Success) { throw 'No inline JavaScript block found in src/index.html' }
          $js = Join-Path $env:TEMP 'ics-inline-check.js'
          Set-Content -Path $js -Value $match.Groups[1].Value -NoNewline
          node --check $js
          python -m py_compile src-tauri/whisper_run.py src-tauri/cohere_run.py src-tauri/env_check.py
          Get-Content 'package.json' -Raw | ConvertFrom-Json | Out-Null
          Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json | Out-Null
          Get-Content 'src-tauri/capabilities/default.json' -Raw | ConvertFrom-Json | Out-Null
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: Fetch build assets
        shell: pwsh
        run: ./scripts/fetch-binaries.ps1
      - run: npm install
      - run: npx tauri icon app-icon.png
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: Insta-Clip-Studio-Setup
          path: src-tauri/target/release/bundle/nsis/*.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
